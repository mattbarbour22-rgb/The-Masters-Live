<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2d21"/>
      <stop offset=".42" stop-color="#1f5336"/>
      <stop offset="1" stop-color="#082016"/>
    </linearGradient>
    <linearGradient id="fairway" x1="0" y1=".1" x2="1" y2="1">
      <stop offset="0" stop-color="#9aca63"/>
      <stop offset=".35" stop-color="#5fa43f"/>
      <stop offset=".72" stop-color="#2e722e"/>
      <stop offset="1" stop-color="#174f28"/>
    </linearGradient>
    <linearGradient id="green" x1=".15" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#b7d86a"/>
      <stop offset=".5" stop-color="#77bb4d"/>
      <stop offset="1" stop-color="#3d8a36"/>
    </linearGradient>
    <linearGradient id="creek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153b36"/>
      <stop offset=".45" stop-color="#4e8b7a"/>
      <stop offset="1" stop-color="#0b2421"/>
    </linearGradient>
    <radialGradient id="bunker" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#f4e7bd"/>
      <stop offset=".7" stop-color="#d8c289"/>
      <stop offset="1" stop-color="#bba46d"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00150e" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="2400" height="1400" fill="url(#sky)"/>

  <!-- pine wall -->
  <g opacity=".98">
    <path d="M0 0h2400v410C2130 330 1960 350 1720 310C1390 255 1130 225 820 305C540 378 295 355 0 445Z" fill="#092719"/>
    <g opacity=".75">
      <path d="M120 430l80-300 80 300zM310 400l95-350 95 350zM520 430l78-310 78 310zM760 385l105-360 105 360zM1030 405l90-335 90 335zM1320 375l112-365 112 365zM1640 405l94-335 94 335zM1900 388l110-350 110 350zM2180 430l82-300 82 300z" fill="#0b341f"/>
    </g>
  </g>

  <!-- late afternoon glow -->
  <circle cx="1850" cy="120" r="470" fill="#f4c84a" opacity=".15" filter="url(#blur)"/>

  <!-- fairway shapes -->
  <path d="M-80 1120C275 915 640 860 965 925C1285 990 1600 1022 1960 900C2165 830 2315 745 2480 670V1400H-80Z" fill="url(#fairway)"/>
  <path d="M-80 1190C420 1030 735 1018 1080 1082C1455 1152 1788 1078 2105 955C2245 900 2360 842 2480 792V1400H-80Z" fill="#14562a" opacity=".72"/>

  <!-- Rae's Creek -->
  <path d="M-70 940C270 830 610 852 880 915C1180 985 1510 975 1835 870C2045 800 2220 725 2470 595V760C2190 935 1908 1058 1545 1100C1180 1142 905 1035 625 1018C360 1000 120 1052-70 1166Z" fill="url(#creek)" filter="url(#shadow)"/>
  <path d="M-55 965C280 875 600 892 880 943C1190 1002 1510 995 1845 884C2066 811 2244 735 2460 630" fill="none" stroke="#bfe8d8" stroke-width="7" opacity=".30"/>

  <!-- green complex / 12th -->
  <g filter="url(#shadow)">
    <path d="M1020 750C1215 680 1460 690 1626 766C1768 832 1748 938 1585 1000C1392 1074 1110 1015 1010 905C948 836 930 783 1020 750Z" fill="url(#green)"/>
    <path d="M1105 782C1265 730 1450 739 1572 793C1662 833 1654 900 1546 942C1395 1000 1170 960 1088 880C1048 840 1055 801 1105 782Z" fill="#8dca58" opacity=".85"/>
    <ellipse cx="1538" cy="866" rx="155" ry="72" fill="url(#bunker)" opacity=".98" transform="rotate(-8 1538 866)"/>
    <ellipse cx="1190" cy="930" rx="142" ry="58" fill="url(#bunker)" opacity=".92" transform="rotate(13 1190 930)"/>
    <path d="M1412 796v-122" stroke="#f7f0cf" stroke-width="8"/>
    <path d="M1418 674l105 36-105 36z" fill="#f6d04d"/>
    <circle cx="1412" cy="796" r="12" fill="#f7f0cf"/>
  </g>

  <!-- azaleas -->
  <g opacity=".88" filter="url(#blur)">
    <circle cx="735" cy="825" r="80" fill="#d85b95"/>
    <circle cx="840" cy="800" r="62" fill="#f07aaa"/>
    <circle cx="1750" cy="745" r="74" fill="#d85b95"/>
    <circle cx="1845" cy="705" r="58" fill="#ed73a5"/>
  </g>

  <!-- foreground vignette -->
  <rect width="2400" height="1400" fill="url(#sky)" opacity=".10"/>
</svg>